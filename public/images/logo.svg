<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 88" fill="none">
  <style>
    .logo-text {
      font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 46px;
      fill: #111111;
      letter-spacing: 5px;
    }
  </style>

  <!-- KING -->
  <text class="logo-text" x="2" y="66">KING</text>

  <!-- Cross / interlocking link icon, centered between the two words -->
  <!-- Placed at x=175, 78px wide × 78px tall -->
  <g transform="translate(174, 5)">

    <!-- Outer cross shape with rounded arm-end corners -->
    <path
      d="M27,0 L51,0 Q59,0 59,8 L59,27 L70,27 Q78,27 78,35 L78,43 Q78,51 70,51 L59,51 L59,70 Q59,78 51,78 L27,78 Q19,78 19,70 L19,51 L8,51 Q0,51 0,43 L0,35 Q0,27 8,27 L19,27 L19,8 Q19,0 27,0 Z"
      stroke="#111111"
      stroke-width="6.5"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- S-curve divider creating the interlocking chain-link effect -->
    <!-- Runs horizontally: left arm center → curves up through body → right arm center -->
    <path
      d="M0,39 C18,39 18,27 39,27 C60,27 60,39 78,39"
      stroke="#111111"
      stroke-width="6.5"
      stroke-linecap="round"
      fill="none"
    />
  </g>

  <!-- RESEARCH -->
  <text class="logo-text" x="270" y="66">RESEARCH</text>
</svg>
