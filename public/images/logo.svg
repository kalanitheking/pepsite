<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 122" fill="none">
  <!--
    KING — right-aligned so the gap to the crown left edge is always exactly 13px.
    Text-anchor="end" guarantees no overlap regardless of font rendering.
  -->
  <text x="287" y="98"
        text-anchor="end"
        font-family="Impact, 'Arial Black', 'Franklin Gothic Heavy', sans-serif"
        font-weight="900" font-size="82" fill="#1e293b" letter-spacing="6">KING</text>

  <!--
    Crown: 180 px wide × 119 px tall (scale = 180/144 = 1.25 of master geometry).
    Center peak tallest (y=0), outer peaks at y=28, deep valleys at y=75, base at y=100.
    Inner lines: outer-peak → opposite valley (X crossing).
    Double base bars at y=109 and y=119.
  -->
  <g transform="translate(300, 2)" stroke="#1e293b" stroke-width="8"
     fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="0,100 20,28 53,75 90,0 128,75 160,28 180,100"/>
    <line x1="20"  y1="28"  x2="128" y2="75"/>
    <line x1="160" y1="28"  x2="53"  y2="75"/>
    <line x1="0"   y1="109" x2="180" y2="109"/>
    <line x1="0"   y1="119" x2="180" y2="119"/>
  </g>

  <!--
    RESEARCH — left-aligned 13px after the crown right edge (300+180+13 = 493).
    Text-anchor="start" ensures it never overlaps the crown.
  -->
  <text x="493" y="98"
        text-anchor="start"
        font-family="Impact, 'Arial Black', 'Franklin Gothic Heavy', sans-serif"
        font-weight="900" font-size="82" fill="#1e293b" letter-spacing="6">RESEARCH</text>
</svg>
