<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" fill="none">
  <!-- KING -->
  <text x="10" y="80"
        font-family="'Arial Black', 'Franklin Gothic Heavy', Impact, sans-serif"
        font-weight="900" font-size="76" fill="#1e293b" letter-spacing="4">KING</text>

  <!-- Crown icon (140 × 85 box, positioned to align baseline with text) -->
  <g transform="translate(252, 4)" stroke="#1e293b" stroke-width="6"
     fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Crown outer silhouette: 3 peaks + 2 valleys, open bottom -->
    <polyline points="2,73 20,5 46,44 70,5 94,44 120,5 138,73"/>
    <!-- Interior lines: bottom-left → center peak and bottom-right → center peak -->
    <line x1="2"   y1="73" x2="70" y2="5"/>
    <line x1="138" y1="73" x2="70" y2="5"/>
    <!-- Double underline base -->
    <line x1="2" y1="80" x2="138" y2="80"/>
    <line x1="2" y1="90" x2="138" y2="90"/>
  </g>

  <!-- RESEARCH -->
  <text x="406" y="80"
        font-family="'Arial Black', 'Franklin Gothic Heavy', Impact, sans-serif"
        font-weight="900" font-size="76" fill="#1e293b" letter-spacing="4">RESEARCH</text>
</svg>
