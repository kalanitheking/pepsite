<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 102" fill="none">
  <!--
    KING — right-aligned so the gap to the crown is always exactly 12px,
    regardless of which bold font the browser picks.
    Crown occupies x=330 → x=474 (144 units wide).
  -->
  <text x="318" y="82"
        text-anchor="end"
        font-family="'Arial Black', 'Franklin Gothic Heavy', Impact, sans-serif"
        font-weight="900" font-size="76" fill="#1e293b" letter-spacing="3">KING</text>

  <!--
    Crown: 144 units wide × 97 units tall (incl. base bars).
    Inner lines run from each BASE CORNER to the opposite OUTER PEAK —
    these are the long diagonals that cross in the centre and create the
    four-facet diamond pattern visible in the reference logo.
  -->
  <g transform="translate(330, 2)" stroke="#1e293b" stroke-width="6.5"
     fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer silhouette: center peak tallest (y=0), outer peaks shorter (y=22), deep valleys (y=60) -->
    <polyline points="0,80 16,22 42,60 72,0 102,60 128,22 144,80"/>
    <!-- Inner lines: outer-peak → opposite valley (creates X crossing) -->
    <line x1="16"  y1="22" x2="102" y2="60"/>
    <line x1="128" y1="22" x2="42"  y2="60"/>
    <!-- Double underline base bars -->
    <line x1="0" y1="88" x2="144" y2="88"/>
    <line x1="0" y1="98" x2="144" y2="98"/>
  </g>

  <!--
    RESEARCH — left-aligned from 12px after the crown ends (x=474+12=486).
  -->
  <text x="486" y="82"
        text-anchor="start"
        font-family="'Arial Black', 'Franklin Gothic Heavy', Impact, sans-serif"
        font-weight="900" font-size="76" fill="#1e293b" letter-spacing="3">RESEARCH</text>
</svg>
